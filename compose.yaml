services:
  chiorim:
    build:
      context: .
      dockerfile: Dockerfile
    image: chiorim:latest
    container_name: chiorim
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DATA_DIR: /data
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PUBLIC_UPLOADS: "${PUBLIC_UPLOADS:-false}"
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-10485760}"
      BRIDGE_PUBLIC_URL: "${BRIDGE_PUBLIC_URL:-}"
      APP_SECRET: "${APP_SECRET:-}"
      NODE_OPTIONS: "--max-old-space-size=256"
    volumes:
      - chiorim_data:/data
    mem_limit: 384m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chiorim_data:
